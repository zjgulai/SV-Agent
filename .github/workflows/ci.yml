name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reverse_engineer_mode
          POSTGRES_USER: reverse_engineer_mode
          POSTGRES_PASSWORD: local-development-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reverse_engineer_mode -d reverse_engineer_mode"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      REM_DATABASE_URL: postgresql+asyncpg://reverse_engineer_mode:local-development-only@localhost:5432/reverse_engineer_mode
      REM_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://reverse_engineer_mode:local-development-only@localhost:5432/reverse_engineer_mode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Backend dependencies
        run: uv sync --project apps/api --python 3.12 --all-extras --frozen
      - name: "SV-Agent synthetic — artifact contracts and workflow oracle"
        timeout-minutes: 5
        run: |
          {
            echo "### SV-Agent synthetic · Batch 1 contract gates"
            echo "Canonical artifact schema: typed artifacts, references, closed values and cross-artifact invariants."
            echo "Fixture shape: committed synthetic inputs are readable; this is not canonical artifact validation."
            echo "Workflow expectations: six synthetic mechanism routes return bounded dispositions and stable finding codes."
            echo "Scope excludes runtime persistence, providers, real media, publication and approval."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/api python -m unittest tools.viral_replication.tests.test_artifact_contracts -v
          uv run --project apps/api python -m unittest tools.viral_replication_oracle.tests.test_oracle -v
          uv run --project apps/api python -m tools.viral_replication_oracle
          uv run --project apps/api ruff check tools/viral_replication tools/viral_replication_oracle
          uv run --project apps/api ruff format --check tools/viral_replication tools/viral_replication_oracle
          uv run --project apps/api python -m mypy --explicit-package-bases tools/viral_replication tools/viral_replication_oracle
          echo "Result: all three bounded synthetic gates passed." >> "$GITHUB_STEP_SUMMARY"
      - name: "Momcozy synthetic — Layer 1: contracts and static checks"
        timeout-minutes: 3
        run: |
          {
            echo "### Momcozy synthetic CI · Layer 1/3 — contracts and static checks"
            echo "Scope: committed synthetic fixtures only; no ignored real media library."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/api python -m unittest tools.momcozy_assets.tests.test_contracts -v
          uv run --project apps/api ruff check tools/momcozy_assets
          uv run --project apps/api python -m mypy --explicit-package-bases tools/momcozy_assets/aggregate_index.py tools/momcozy_assets/contracts.py tools/momcozy_assets/private_gate.py
          echo "Result: passed." >> "$GITHUB_STEP_SUMMARY"
      - name: "Momcozy synthetic — Layer 2: Aggregate Index contracts"
        timeout-minutes: 5
        run: |
          {
            echo "### Momcozy synthetic CI · Layer 2/3 — Aggregate Index contracts"
            echo "Scope: committed synthetic fixtures only; no ignored real media library."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/api python -m unittest tools.momcozy_assets.tests.test_aggregate_index -v
          echo "Result: passed." >> "$GITHUB_STEP_SUMMARY"
      - name: "Momcozy synthetic — Layer 3: Private Gate contracts"
        timeout-minutes: 10
        run: |
          {
            echo "### Momcozy synthetic CI · Layer 3/3 — Private Gate contracts"
            echo "Scope: committed synthetic fixtures only; this is not a real-library Private Gate receipt."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --project apps/api python -m unittest tools.momcozy_assets.tests.test_private_gate -v
          echo "Result: passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Backend migration and checks
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api ruff check apps/api migrations
          uv run --project apps/api mypy apps/api/app
          uv run --project apps/api pytest apps/api/tests -q
      - name: Frontend dependencies
        run: npm --prefix apps/web ci
      - name: Frontend checks
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test -- --run
          npm --prefix apps/web run build
      - name: Install Chromium
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Start E2E stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Browser E2E
        run: npm --prefix apps/web run e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-artifacts
          retention-days: 3
          path: |
            apps/web/playwright-report
            apps/web/test-results
